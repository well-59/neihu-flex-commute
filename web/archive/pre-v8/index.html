<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>內湖錯峰協商台</title>
<meta name="description" content="內湖晨峰通勤口的錯峰試算：同樣的車次，改變的是等待。">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --s1: #eb6834;   /* 原配置 */
  --s2: #1baf7a;   /* 調整後 */
  --good: #006300;
  --chip: #f0efec;
  --badge-bg: #fff4d6; --badge-ink: #6b4d00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.10);
    --s1: #d95926; --s2: #199e70; --good: #0ca30c; --chip: #262624;
    --badge-bg: #3a2e0a; --badge-ink: #f5d98a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.10);
  --s1: #d95926; --s2: #199e70; --good: #0ca30c; --chip: #262624;
  --badge-bg: #3a2e0a; --badge-ink: #f5d98a;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 32px; }
.top { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.top b { font-size: 16px; }
.badge { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--badge-bg); color: var(--badge-ink); }
.eyebrow { font-size: 13px; color: var(--muted); }
h1 { font-size: 30px; line-height: 1.3; margin: 2px 0 18px; font-weight: 680; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 10px; font-weight: 620; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spacer { flex: 1; }
.muted { color: var(--muted); font-size: 13px; }

/* overview: gate picker */
.ov { display: grid; grid-template-columns: max-content 1fr max-content; gap: 4px 10px; align-items: center; }
.ov .name { font-size: 14px; cursor: pointer; background: none; border: 0; color: var(--ink-2); text-align: left; padding: 2px 0; font: inherit; }
.ov .name.on { color: var(--ink); font-weight: 650; }
.ov .name.on::before { content: "▸ "; }
.ov .strip { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; cursor: pointer; border-radius: 4px; }
.ov .strip span { height: 18px; border-radius: 3px; }
.ov .peak { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov .ticks { grid-column: 2; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

/* controls */
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chip { border: 1px solid var(--border); background: transparent; color: var(--ink); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
.chip:hover { background: var(--chip); }
.ctrl-grid { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 20px; margin-top: 16px; }
@media (max-width: 760px) { .ctrl-grid { grid-template-columns: 1fr; } }
.ctrl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.ctrl label b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ctrl select { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; }
.ctrl input[type=range] { width: 100%; accent-color: var(--s2); }
.ctrl[aria-disabled="true"] { opacity: .4; pointer-events: none; }

/* summary */
.summary { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin: 18px 0 10px; }
.summary .main { font-size: 18px; font-weight: 650; }
.summary .split { font-size: 14px; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.stat .label { font-size: 13px; color: var(--ink-2); }
.stat .value { font-size: 30px; font-weight: 650; line-height: 1.25; }
.stat .value small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.stat .foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.stat .foot b { color: var(--good); font-weight: 600; }

/* chart */
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.legend i.dash { height: 0; width: 14px; border-top: 2px dashed var(--ink-2); border-radius: 0; vertical-align: 3px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
.axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.axis line { stroke: var(--grid); }
.qrows { display: grid; grid-template-columns: 56px repeat(var(--n), minmax(0, 1fr)); gap: 3px; margin-top: 14px; font-size: 12px; }
.qrows .lab { color: var(--ink-2); display: flex; align-items: center; }
.qrows .c { height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--chip); }
.qrows .t { color: var(--muted); font-size: 11px; text-align: center; }

/* threshold */
.goal { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.goal .big { font-size: 20px; font-weight: 650; }
.btn { border: 0; background: var(--ink); color: var(--surface); font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 10px; cursor: pointer; }
footer { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }

#tip { position: fixed; pointer-events: none; z-index: 10; display: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.14); }
#tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
</style>
</head>
<body><p style="padding:12px;background:#fff0d3;color:#543e23">歷史展示頁，不是現行版本。<a href="../../traffic-island.html">返回目前 3D 版本</a></p><p style="padding:14px;border:1px solid #ffb279;border-radius:8px;margin:14px;font-size:13px">舊版模型紀錄：基準反推一致性未通過檢核，車小時不可作為現場效益依據。<a href="../../planner.html" style="color:#79ddbf;text-decoration:underline">前往新版交通證據與企業配置 →</a></p>
<div class="wrap">
  <div class="top"><b>內湖錯峰協商台</b><span class="badge" id="badge"></span></div>

  <p><a href="../../planner.html" style="color:var(--s2);font-weight:700">新版：內湖時間島 · 交通證據與企業條件 →</a> · <a href="negotiation.html" style="color:var(--s2)">企業協商實驗室 →</a></p>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="headline"></h1>

  <!-- where it jams -->
  <div class="card">
    <div class="row" style="margin-bottom:10px"><h2 style="margin:0">現況：每個通勤口塞多久？</h2><span class="spacer"></span><span class="muted">顏色越深＝車龍越長・● 這家公司員工會經過</span></div>
    <div class="ov" id="ov"></div>
  </div>

  <!-- scenario -->
  <div class="card">
    <div class="row">
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="split">分批錯峰</button>
        <button type="button" data-mode="all">全體一起延後</button>
      </div>
      <span class="spacer"></span>
      <span class="muted">快速比較</span>
      <span id="presets" class="row" style="gap:6px"></span>
    </div>
    <div class="ctrl-grid">
      <div class="ctrl" id="ctrlArch">
        <label for="arch">誰來錯峰</label>
        <select id="arch"></select>
      </div>
      <div class="ctrl" id="ctrlPct">
        <label for="pct">參與員工 <b id="pctVal"></b></label>
        <input id="pct" type="range" min="0" max="100" step="5">
      </div>
      <div class="ctrl">
        <label for="shift">延後</label>
        <select id="shift">
          <option value="15">15 分鐘</option><option value="30">30 分鐘</option>
          <option value="45">45 分鐘</option><option value="60">60 分鐘</option>
        </select>
      </div>
    </div>
  </div>

  <div class="summary">
    <span class="main" id="sumMain"></span>
    <span class="split" id="sumSplit"></span>
  </div>
  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="row" style="margin-bottom:6px">
      <h2 style="margin:0">車從哪個時段移到哪個時段</h2>
      <span class="spacer"></span>
      <div class="legend"><span><i style="background:var(--s1)"></i>移走的車</span><span><i style="background:var(--s2)"></i>移入的車</span></div>
    </div>
    <svg id="chart" viewBox="0 0 1000 200" role="img" aria-label="每 15 分鐘移走與移入的車"></svg>
    <h2 style="margin:18px 0 0">車龍長度（台）</h2>
    <div class="qrows" id="qrows"></div>
  </div>

  <div class="card goal" id="goal"></div>

  <footer>
    <span id="foot1"></span>
    <a href="../../evidence/index.html" style="color:var(--ink-2)">查看 2025 官方路口調查 →</a>
    <span>單一瓶頸模型 · 不含下游回堵與回流</span>
  </footer>
</div>
<div id="tip"></div>

<script src="../../data/neihu-data.js"></script>
<script>
(function () {
  'use strict';
  const D = window.NEIHU_DATA;
  const DT = D.meta.slotMinutes;
  const N = D.slots.length;
  const $ = (id) => document.getElementById(id);
  const fmt = (n, d = 0) => Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
  const gateById = Object.fromEntries(D.gates.map((g) => [g.id, g]));
  const archById = Object.fromEntries(D.archetypes.map((a) => [a.id, a]));
  const day = Object.keys(D.days)[0];
  document.documentElement.style.setProperty('--n', N);

  const mainGateOf = (a) => Object.entries(a.gateShare).sort((x, y) => y[1] - x[1])[0][0];
  const PRESETS = [
    { label: '電子廠 10%・晚 60 分', mode: 'split', arch: 'A', pct: 10, shift: 60 },
    { label: '電子廠 30%・晚 60 分', mode: 'split', arch: 'A', pct: 30, shift: 60 },
    { label: '全體晚 45 分', mode: 'all', arch: 'A', pct: 100, shift: 45 },
  ];
  const state = { mode: 'split', arch: 'A', pct: 10, shift: 60, gate: mainGateOf(archById.A) };

  const qs = new URLSearchParams(location.search);
  if (['light', 'dark'].includes(qs.get('theme'))) document.documentElement.dataset.theme = qs.get('theme');
  if (archById[qs.get('arch')]) { state.arch = qs.get('arch'); state.gate = mainGateOf(archById[state.arch]); }
  if (gateById[qs.get('gate')]) state.gate = qs.get('gate');
  if (qs.get('mode') === 'all') state.mode = 'all';
  if (qs.has('pct')) state.pct = Math.min(100, Math.max(0, Math.round(Number(qs.get('pct')) / 5) * 5)) || 0;
  if ([15, 30, 45, 60].includes(Number(qs.get('shift')))) state.shift = Number(qs.get('shift'));

  // ---------- model: deterministic point queue (from v1) ----------
  function simulate(arrivals, capacity) {
    let q = 0, delay = 0, maximum = 0, lastClear = null;
    const rows = [];
    for (let i = 0; i < arrivals.length || q > 1e-8; i += 1) {
      if (i > 500) throw new Error('Queue did not clear.');
      const a = arrivals[i] || 0;
      const q0 = q, change = a - capacity, q1 = Math.max(0, q0 + change);
      let area;
      if (change < 0 && q1 === 0) {
        const busy = q0 > 0 ? DT * q0 / (-change) : 0;
        area = 0.5 * q0 * busy;
        if (q0 > 0) lastClear = i * DT + busy;
      } else {
        area = DT * (q0 + q1) / 2;
      }
      delay += area;
      maximum = Math.max(maximum, q1);
      rows.push({ a, q1, mean: area / DT, wait: area / capacity });
      q = q1;
    }
    return { delay, maximum, lastClear, rows };
  }

  function scenario(gateId) {
    const g = gateById[gateId];
    const base = D.days[day][gateId];
    const s = state.shift / DT;
    let after, moved = new Array(N).fill(0);
    if (state.mode === 'all') {
      // everyone starts later: the whole morning slides by s slots
      after = new Array(s).fill(0).concat(base);
    } else {
      const a = archById[state.arch];
      const share = a.gateShare[gateId] || 0;
      moved = a.arrivalDist.map((p) => a.staff * a.driveShare * share * p * state.pct / 100);
      after = base.slice();
      moved.forEach((m, k) => { if (m) { after[k] -= m; after[Math.min(N - 1, k + s)] += m; } });
    }
    const b = simulate(base, g.capacity), x = simulate(after, g.capacity);
    let moverSave = 0, movedVeh = 0;
    moved.forEach((m, k) => {
      if (!m) return;
      moverSave += m * (b.rows[k].wait - x.rows[Math.min(N - 1, k + s)].wait);
      movedVeh += m;
    });
    return { g, base, after, b, x, moverSave, movedVeh };
  }

  // ---------- helpers ----------
  const clock = (minFromStart) => {
    const [h, m] = D.slots[0].split(':').map(Number);
    const t = Math.round(h * 60 + m + minFromStart);
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  };
  const slotEnd = (i) => clock((i + 1) * DT);
  const dur = (m) => (m >= 60 ? Math.floor(m / 60) + ' 小時' + (m % 60 ? ' ' + (m % 60) + ' 分' : '') : m + ' 分');
  const heat = (v, max) => {
    const p = max > 0 ? Math.min(1, v / max) : 0;
    return 'color-mix(in oklab, var(--s1) ' + Math.round(8 + p * 85) + '%, var(--surface))';
  };
  const tip = $('tip');
  const showTip = (html, ev) => {
    tip.innerHTML = html; tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  };
  const hideTip = () => { tip.style.display = 'none'; };
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  };
  const niceMax = (v) => {
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  };

  // ---------- static UI ----------
  const sample = D.meta.source === 'sample';
  $('badge').textContent = sample ? '樣本資料・非實測' : '真實資料・臺北市 VD';
  $('foot1').textContent = (sample ? '樣本資料' : '臺北市 VD 實測') + ' · 公司類型為模擬';

  D.archetypes.forEach((a) => $('arch').appendChild(new Option(a.name + '（' + fmt(a.staff) + ' 人）', a.id)));
  PRESETS.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = p.label;
    b.addEventListener('click', () => {
      Object.assign(state, { mode: p.mode, arch: p.arch, pct: p.pct, shift: p.shift, gate: mainGateOf(archById[p.arch]) });
      update();
    });
    $('presets').appendChild(b);
  });
  $('modeSeg').addEventListener('click', (e) => { if (e.target.dataset.mode) { state.mode = e.target.dataset.mode; update(); } });
  $('arch').addEventListener('change', (e) => { state.arch = e.target.value; state.gate = mainGateOf(archById[state.arch]); update(); });
  $('pct').addEventListener('input', (e) => { state.pct = Number(e.target.value); update(); });
  $('shift').addEventListener('change', (e) => { state.shift = Number(e.target.value); update(); });

  // ---------- render ----------
  function renderOverview() {
    const ov = $('ov');
    ov.innerHTML = '';
    const all = D.gates.map((g) => ({ g, r: simulate(D.days[day][g.id], g.capacity) }));
    const max = Math.max(...all.flatMap((o) => o.r.rows.slice(0, N).map((x) => x.mean)));
    const used = state.mode === 'split' ? archById[state.arch].gateShare : {};
    for (const { g, r } of all) {
      const pick = () => { state.gate = g.id; update(); };
      const name = document.createElement('button');
      name.type = 'button';
      name.className = 'name' + (g.id === state.gate ? ' on' : '');
      name.textContent = g.name + (used[g.id] ? ' ●' : '');
      name.title = used[g.id] ? '這家公司的員工會經過這裡' : '';
      name.addEventListener('click', pick);
      const strip = document.createElement('div');
      strip.className = 'strip';
      strip.addEventListener('click', pick);
      r.rows.slice(0, N).forEach((x, i) => {
        const s = document.createElement('span');
        s.style.background = heat(x.mean, max);
        s.addEventListener('mousemove', (ev) => showTip('<b>' + g.name + '</b> ' + D.slots[i] + '–' + slotEnd(i) +
          '<br>車龍約 ' + fmt(x.mean) + ' 台・每台多等 ' + fmt(x.wait * 60) + ' 秒', ev));
        s.addEventListener('mouseleave', hideTip);
        strip.appendChild(s);
      });
      // a slot counts as jammed when the average line is at least 5 cars
      const jam = r.rows.slice(0, N).map((x) => x.mean >= 5);
      const first = jam.indexOf(true), last = jam.lastIndexOf(true);
      const mins = jam.filter(Boolean).length * DT;
      const peak = document.createElement('span');
      peak.className = 'peak';
      peak.textContent = first < 0 ? '順暢' : '塞 ' + dur(mins) + '・' + D.slots[first] + '–' + slotEnd(last);
      ov.append(name, strip, peak);
    }
    const ticks = document.createElement('div');
    ticks.className = 'ticks';
    ticks.innerHTML = D.slots.filter((s) => s.endsWith(':00')).map((s) => '<span>' + s + '</span>').join('');
    ov.append(document.createElement('span'), ticks, document.createElement('span'));
  }

  function renderChart(r) {
    const svg = $('chart');
    svg.innerHTML = '';
    // change in cars per slot: below the line = moved out, above = moved in
    const m = { l: 40, r: 10, t: 10, b: 24 }, W = 1000, H = 200, w = W - m.l - m.r, h = H - m.t - m.b, step = w / N;
    const diff = D.slots.map((_, i) => (r.after[i] || 0) - r.base[i]);
    const yMax = niceMax(Math.max(10, ...diff.map(Math.abs)) * 1.1);
    const mid = m.t + h / 2;
    const y = (v) => mid - (h / 2) * v / yMax;
    const ax = el('g', { class: 'axis' });
    for (const v of [-yMax, -yMax / 2, 0, yMax / 2, yMax]) {
      ax.appendChild(el('line', { x1: m.l, x2: m.l + w, y1: y(v), y2: y(v), style: v === 0 ? 'stroke:var(--muted)' : '' }));
      ax.appendChild(el('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, (v > 0 ? '+' : '') + fmt(v)));
    }
    D.slots.forEach((s, i) => { if (s.endsWith(':00')) ax.appendChild(el('text', { x: m.l + step * i + step / 2, y: H - 4, 'text-anchor': 'middle' }, s)); });
    svg.appendChild(ax);
    const bw = Math.min(28, step - 10);
    for (let i = 0; i < N; i += 1) {
      const v = diff[i];
      if (Math.abs(v) >= 0.5) {
        const x = m.l + step * i + (step - bw) / 2, top = Math.min(y(v), mid), hgt = Math.abs(y(v) - mid), rr = Math.min(4, hgt / 2);
        const d = v > 0
          ? 'M' + x + ',' + mid + 'V' + (top + rr) + 'Q' + x + ',' + top + ' ' + (x + rr) + ',' + top + 'H' + (x + bw - rr) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + rr) + 'V' + mid + 'Z'
          : 'M' + x + ',' + mid + 'V' + (mid + hgt - rr) + 'Q' + x + ',' + (mid + hgt) + ' ' + (x + rr) + ',' + (mid + hgt) + 'H' + (x + bw - rr) + 'Q' + (x + bw) + ',' + (mid + hgt) + ' ' + (x + bw) + ',' + (mid + hgt - rr) + 'V' + mid + 'Z';
        svg.appendChild(el('path', { d, fill: v > 0 ? 'var(--s2)' : 'var(--s1)' }));
      }
      const hit = el('rect', { x: m.l + step * i, y: m.t, width: step, height: h, fill: 'transparent' });
      hit.addEventListener('mousemove', (ev) => showTip('<b>' + D.slots[i] + '–' + slotEnd(i) + '</b><br>' +
        (Math.abs(diff[i]) < 0.5 ? '沒有變動' : (diff[i] > 0 ? '<i style="background:var(--s2)"></i>移入 ' : '<i style="background:var(--s1)"></i>移走 ') + fmt(Math.abs(diff[i])) + ' 台') +
        '<br>原本 ' + fmt(r.base[i]) + ' 台 → ' + fmt(r.after[i] || 0) + ' 台', ev));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
    }

    // average queue per slot, both rows always visible
    const qb = r.b.rows.slice(0, N).map((x) => x.mean), qa = r.x.rows.slice(0, N).map((x) => x.mean);
    const max = Math.max(1, ...qb, ...qa);
    let html = '';
    for (const [lab, vals] of [['原本', qb], ['調整後', qa]]) {
      html += '<div class="lab">' + lab + '</div>';
      for (const v of vals) {
        const strong = v / max > 0.55;
        html += '<div class="c" style="' + (v >= 1 ? 'background:' + heat(v, max) + ';color:' + (strong ? '#fff' : 'var(--ink)') : '') + '">' + (v >= 1 ? fmt(v) : '·') + '</div>';
      }
    }
    html += '<div></div>' + D.slots.map((s) => '<div class="t">' + (s.endsWith(':00') ? s : '') + '</div>').join('');
    $('qrows').innerHTML = html;
  }

  function update() {
    const a = archById[state.arch];
    const r = scenario(state.gate);
    const split = state.mode === 'split';

    document.querySelectorAll('#modeSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
    $('ctrlArch').setAttribute('aria-disabled', String(!split));
    $('ctrlPct').setAttribute('aria-disabled', String(!split));
    $('arch').value = state.arch;
    $('pct').value = state.pct;
    $('pctVal').textContent = state.pct + '%・' + fmt(a.staff * state.pct / 100) + ' 人';
    $('shift').value = state.shift;

    const total = r.base.reduce((s, v) => s + v, 0);
    $('eyebrow').textContent = r.g.name + '・' + r.g.dir + '・' + D.slots[0] + '–' + slotEnd(N - 1);
    $('headline').textContent = '同樣 ' + fmt(total / 10000, 1) + ' 萬台車，改變的是等待。';

    const cut = r.b.delay > 0 ? (r.b.delay - r.x.delay) / r.b.delay : 0;
    const who = split ? a.name + ' ' + fmt(a.staff * state.pct / 100) + ' 人晚 ' + state.shift + ' 分上班' : '所有人晚 ' + state.shift + ' 分上班';
    $('sumMain').textContent = who + ' → ' + (Math.abs(cut) < 0.005 ? '大家等待沒有減少' : '大家' + (cut > 0 ? '少等 ' : '多等 ') + fmt(Math.abs(cut) * 100, 0) + '%');
    if (!split) {
      $('sumSplit').textContent = '塞車只是整段往後移。';
    } else if (r.movedVeh < 1) {
      $('sumSplit').textContent = '這家公司的員工不經過' + r.g.name + '。';
    } else {
      const per = r.moverSave / r.movedVeh * 60;
      $('sumSplit').textContent = '晚上班的員工每人' + (per >= 3 ? '少等 ' + fmt(per) + ' 秒' : per <= -3 ? '反而多等 ' + fmt(-per) + ' 秒' : '幾乎沒差');
    }

    const stat = (label, value, unit, before, change) =>
      '<div class="stat"><div class="label">' + label + '</div><div class="value">' + value + (unit ? '<small>' + unit + '</small>' : '') +
      '</div><div class="foot"><span>原本 ' + before + '</span>' + (change ? '<b' + (/^(多|變長)/.test(change) ? ' style="color:var(--ink-2)"' : '') + '>' + change + '</b>' : '') + '</div></div>';
    const hb = r.b.delay / 60, hx = r.x.delay / 60, dm = r.b.maximum - r.x.maximum;
    const avgB = r.b.delay * 60 / total, avgX = r.x.delay * 60 / total;   // seconds per car
    $('stats').innerHTML =
      stat('大家加起來多等', fmt(hx), '小時', fmt(hb) + ' 小時',
        hb - hx >= 0.5 ? '少 ' + fmt(hb - hx) + ' 小時' : hx - hb >= 0.5 ? '多 ' + fmt(hx - hb) + ' 小時' : '') +
      stat('最長車龍', fmt(r.x.maximum), '台', fmt(r.b.maximum) + ' 台', dm >= 1 ? '短 ' + fmt(dm) + ' 台' : dm <= -1 ? '變長 ' + fmt(-dm) + ' 台' : '') +
      stat('每台車平均多等', fmt(avgX), '秒', fmt(avgB) + ' 秒', avgB - avgX >= 1 ? '少 ' + fmt(avgB - avgX) + ' 秒' : avgX - avgB >= 1 ? '多 ' + fmt(avgX - avgB) + ' 秒' : '');

    renderOverview();
    renderChart(r);
    renderGoal(a);
  }

  // Smallest participation that halves cumulative wait at the selected gate.
  function renderGoal(a) {
    const goal = $('goal');
    if (state.mode !== 'split' || !(a.gateShare[state.gate] > 0)) {
      goal.innerHTML = '<div><div class="muted">試辦門檻</div><div class="big">切到「分批錯峰」，並選擇會經過' + gateById[state.gate].name + '的公司</div></div>';
      return;
    }
    const keep = state.pct;
    let found = null;
    for (let p = 5; p <= 100 && found == null; p += 5) {
      state.pct = p;
      const r = scenario(state.gate);
      if (r.b.delay > 0 && (r.b.delay - r.x.delay) / r.b.delay >= 0.5) found = p;
    }
    state.pct = keep;
    if (found == null) {
      goal.innerHTML = '<div><div class="muted">試辦門檻・讓' + gateById[state.gate].name + '等待減半</div><div class="big">' + a.name + '單獨做不到，需要其他公司一起錯峰</div></div>';
      return;
    }
    goal.innerHTML = '<div><div class="muted">試辦門檻・讓' + gateById[state.gate].name + '等待減半</div><div class="big">' + a.name + '需要 ' + found + '% 員工晚 ' + state.shift + ' 分</div></div>' +
      '<span class="spacer"></span><button class="btn" type="button" id="tryGoal">試試這個配置</button>';
    $('tryGoal').addEventListener('click', () => { state.pct = found; update(); });
  }

  update();
})();
</script>
</body>
</html>
