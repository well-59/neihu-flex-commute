  #neihu-aha-dashboard {
    --nh-background: light-dark(#f2f5f6, #11181e);
    --nh-surface: light-dark(#ffffff, #1b252e);
    --nh-soft: light-dark(#edf2f3, #26343e);
    --nh-ink: light-dark(#20313a, #eef3f5);
    --nh-muted: light-dark(#596d78, #b0c0c9);
    --nh-line: light-dark(#dae3e7, #3a4b57);
    --nh-before: light-dark(#cf8778, #ddaa9c);
    --nh-after: light-dark(#187867, #6dc9b0);
    --nh-heat: light-dark(#d36e4a, #ed956f);
    --nh-alert: light-dark(#fff2d6, #3d3220);
    --nh-alert-ink: light-dark(#75521a, #f0cb80);
    --nh-active: light-dark(#213740, #dce8ed);
    --nh-active-ink: light-dark(#ffffff, #182832);
    color: var(--nh-ink);
    background: var(--nh-background);
    font-family: Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Neihu Sans TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    width: 100%;
    min-width: 0;
    border-radius: 16px;
    overflow: hidden;
  }
  #neihu-aha-dashboard * { box-sizing: border-box; }
  #neihu-aha-dashboard button, #neihu-aha-dashboard select, #neihu-aha-dashboard input { font: inherit; }
  #neihu-aha-dashboard button, #neihu-aha-dashboard select { color: var(--nh-ink); }
  #neihu-aha-dashboard button { cursor: var(--cursor-interaction, pointer); }
  #neihu-aha-dashboard a { color: inherit; text-decoration: none; }
  #neihu-aha-dashboard .nh-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 19px 28px; border-bottom: 1px solid var(--nh-line); background: var(--nh-surface); }
  #neihu-aha-dashboard .nh-brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; letter-spacing: -.025em; white-space: nowrap; }
  #neihu-aha-dashboard .nh-brand-mark { display: grid; grid-template-columns: repeat(3, 5px); align-items: end; gap: 3px; width: 25px; height: 23px; }
  #neihu-aha-dashboard .nh-brand-mark span { display: block; border-radius: 2px; background: var(--nh-active); }
  #neihu-aha-dashboard .nh-brand-mark span:nth-child(1) { height: 12px; }
  #neihu-aha-dashboard .nh-brand-mark span:nth-child(2) { height: 21px; }
  #neihu-aha-dashboard .nh-brand-mark span:nth-child(3) { height: 16px; }
  #neihu-aha-dashboard .nh-nav { display: flex; gap: 23px; color: var(--nh-muted); font-size: 12px; }
  #neihu-aha-dashboard .nh-nav a:first-child { color: var(--nh-ink); font-weight: 600; }
  #neihu-aha-dashboard .nh-main { display: grid; gap: 18px; padding: 25px 28px 21px; }
  #neihu-aha-dashboard .nh-intro { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
  #neihu-aha-dashboard .nh-eyebrow { color: var(--nh-muted); font-size: 11px; letter-spacing: .09em; margin-bottom: 5px; }
  #neihu-aha-dashboard h1 { margin: 0; font-size: 26px; line-height: 1.3; font-weight: 600; letter-spacing: -.04em; }
  #neihu-aha-dashboard h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; }
  #neihu-aha-dashboard .nh-badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 5px 9px; font-size: 11px; color: var(--nh-alert-ink); background: var(--nh-alert); font-weight: 500; white-space: nowrap; }
  #neihu-aha-dashboard .nh-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  #neihu-aha-dashboard .nh-panel { min-width: 0; border: 1px solid var(--nh-line); border-radius: 12px; background: var(--nh-surface); }
  #neihu-aha-dashboard .nh-controls { padding: 18px 20px 16px; }
  #neihu-aha-dashboard .nh-control-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  #neihu-aha-dashboard .nh-segment { display: flex; background: var(--nh-soft); border-radius: 7px; padding: 3px; }
  #neihu-aha-dashboard .nh-segment button { min-height: 34px; padding: 6px 14px; border: 0; border-radius: 5px; background: transparent; font-size: 12px; }
  #neihu-aha-dashboard .nh-segment button[aria-pressed=&quot;true&quot;] { background: var(--nh-active); color: var(--nh-active-ink); }
  #neihu-aha-dashboard .nh-presets { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  #neihu-aha-dashboard .nh-preset-label { margin-right: 4px; color: var(--nh-muted); font-size: 11px; }
  #neihu-aha-dashboard .nh-preset { border: 1px solid var(--nh-line); background: var(--nh-surface); border-radius: 6px; padding: 5px 8px; min-height: 30px; font-size: 11px; }
  #neihu-aha-dashboard .nh-preset:hover { background: var(--nh-soft); }
  #neihu-aha-dashboard .nh-control-grid { display: grid; grid-template-columns: 1.6fr .8fr 1.2fr; gap: 26px; }
  #neihu-aha-dashboard .nh-field { min-width: 0; }
  #neihu-aha-dashboard .nh-label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 10px; }
  #neihu-aha-dashboard label { font-size: 12px; color: var(--nh-muted); }
  #neihu-aha-dashboard output { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #neihu-aha-dashboard .nh-small-output { font-size: 12px; }
  #neihu-aha-dashboard input[type=&quot;range&quot;] { display: block; width: 100%; accent-color: var(--nh-after); margin: 0; min-height: 22px; }
  #neihu-aha-dashboard input:disabled { opacity: .4; cursor: not-allowed; }
  #neihu-aha-dashboard select { width: 100%; min-height: 34px; padding: 4px 10px; background: var(--nh-surface); border: 1px solid var(--nh-line); border-radius: 6px; }
  #neihu-aha-dashboard .nh-range-ends { display: flex; justify-content: space-between; color: var(--nh-muted); font-size: 11px; margin-top: 3px; }
  #neihu-aha-dashboard .nh-presets-note { color: var(--nh-muted); font-size: 11px; }
  #neihu-aha-dashboard .nh-insight { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 0 2px; }
  #neihu-aha-dashboard .nh-insight-main { font-size: 15px; font-weight: 600; }
  #neihu-aha-dashboard .nh-insight-meta { color: var(--nh-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #neihu-aha-dashboard .nh-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  #neihu-aha-dashboard .nh-stat { padding: 17px 20px 15px; }

      &lt;button id=&quot;nh-apply-threshold&quot; type=&quot;button&quot; class=&quot;nh-apply cursor-interaction&quot;&gt;試試這個配置&lt;/button&gt;
    &lt;/section&gt;

    &lt;footer class=&quot;nh-footer&quot;&gt;&lt;span&gt;合成需求 · 07:00 無排隊 · 全時段固定容量&lt;/span&gt;&lt;span&gt;每格均勻到達 · 單一瓶頸 · 不含下游回堵&lt;/span&gt;&lt;/footer&gt;
    &lt;div id=&quot;nh-accessible-results&quot; class=&quot;nh-sr-only&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;&lt;/div&gt;
  &lt;/main&gt;
&lt;/div&gt;

&lt;script&gt;
(function () {
  &#x27;use strict&#x27;;
  const root = document.getElementById(&#x27;neihu-aha-dashboard&#x27;);
  if (!root) return;
  const get = function (id) { return root.querySelector(&#x27;#&#x27; + id); };
  const baseInput = [180, 240, 420, 420, 240, 180, 120, 0];
  const totalVehicles = baseInput.reduce(function (sum, n) { return sum + n; }, 0);
  const dt = 15;
  const state = { mode: &#x27;split&#x27;, moved: 180, shift: 3, capacity: 300 };
  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  const barNodes = new Map();
  let latest = null;
  let zeroSolutions = [];
  let lastWidth = 0;

  function svgNode(tag, attrs, value) {
    const node = document.createElementNS(ns, tag);
    Object.keys(attrs || {}).forEach(function (key) { node.setAttribute(key, String(attrs[key])); });
    if (value !== undefined) node.textContent = value;
    return node;
  }
  function fmt(value, digits) {
    return Number(value).toLocaleString(&#x27;zh-TW&#x27;, { minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0 });
  }
  function timeAt(minutes) {
    if (minutes === null) return &#x27;全程無排隊&#x27;;
    const value = 420 + Math.round(minutes);
    return String(Math.floor(value / 60)).padStart(2, &#x27;0&#x27;) + &#x27;:&#x27; + String(value % 60).padStart(2, &#x27;0&#x27;);
  }
  function scenario(moved, shift, mode) {
    let a;
    if (mode === &#x27;all&#x27;) {
      a = new Array(shift).fill(0).concat(baseInput);
    } else {
      a = baseInput.slice();
      [2, 3].forEach(function (index) {
        a[index] -= moved / 2;
        while (a.length &lt;= index + shift) a.push(0);
        a[index + shift] += moved / 2;
      });
    }
    while (a.length &lt; 12) a.push(0);
    return a;
  }
  function simulate(arrivals, capacity) {
    let q = 0, delay = 0, maximum = 0, served = 0, lastClear = null;
    const rows = [];
    for (let i = 0; i &lt; arrivals.length || q &gt; 1e-8; i += 1) {
      if (i &gt; 500) throw new Error(&#x27;Queue did not clear.&#x27;);
      const a = arrivals[i] || 0;
      const q0 = q;
      const change = a - capacity;
      const q1 = Math.max(0, q0 + change);
      let area;
      let clearOffset = null;
      if (change &lt; 0 &amp;&amp; q1 === 0) {
        area = q0 &gt; 0 ? 0.5 * q0 * dt * q0 / (-change) : 0;
      } else {
        area = dt * (q0 + q1) / 2;
      }
      if (q0 &gt; 0 &amp;&amp; q1 === 0 &amp;&amp; change &lt; 0) {
        clearOffset = dt * q0 / (-change);
        lastClear = i * dt + clearOffset;
      }
      delay += area;
      served += a + q0 - q1;
      maximum = Math.max(maximum, q0, q1);
      rows.push({ index: i, a: a, q0: q0, q1: q1, area: area, meanQueue: area / dt, clearOffset: clearOffset });
      q = q1;
    }
    return { delay: delay, maximum: maximum, lastClear: lastClear, rows: rows, served: served, endQueue: q, total: arrivals.reduce(function (sum, n) { return sum + n; }, 0) };
  }
  function changeText(before, after, unit) {
    const diff = before - after;
    if (Math.abs(diff) &lt; 1e-7) return &#x27;不變&#x27;;
    return (diff &gt; 0 ? &#x27;減少 &#x27; : &#x27;增加 &#x27;) + fmt(Math.abs(diff), 0) + &#x27; &#x27; + unit;
  }
  function heatColor(value, maximum) {
    const ratio = maximum &gt; 0 ? Math.max(0, Math.min(1, value / maximum)) : 0;
    return &#x27;color-mix(in srgb, var(--nh-heat) &#x27; + (ratio * 90).toFixed(2) + &#x27;%, var(--nh-soft))&#x27;;
  }

  function drawDemand() {
    if (!latest) return;
    const wrap = get(&#x27;nh-demand-wrap&#x27;);
    const width = Math.max(220, Math.round(wrap.getBoundingClientRect().width));
    lastWidth = width;
    const narrow = width &lt; 440;
    const height = narrow ? 220 : 239;
    const margin = { left: 64, right: 12, top: 31, bottom: 39 };
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const n = latest.length;
    const allValues = latest.base.rows.map(function (r) { return r.a; }).concat(latest.after.rows.map(function (r) { return r.a; }), [state.capacity]);
    const ceiling = Math.ceil(Math.max.apply(null, allValues) * 1.13 / 100) * 100;
    const x = function (i) { return margin.left + plotW * i / n; };
    const y = function (v) { return margin.top + plotH * (1 - v / ceiling); };
    const svg = get(&#x27;nh-demand-chart&#x27;);
    svg.setAttribute(&#x27;viewBox&#x27;, &#x27;0 0 &#x27; + width + &#x27; &#x27; + height);
    svg.setAttribute(&#x27;height&#x27;, height);
    const grid = get(&#x27;nh-demand-grid&#x27;);
    const axes = get(&#x27;nh-demand-axes&#x27;);
    grid.replaceChildren(); axes.replaceChildren();
    grid.appendChild(svgNode(&#x27;rect&#x27;, { x: margin.left, y: margin.top, width: plotW, height: plotH, fill: &#x27;none&#x27;, stroke: &#x27;var(--nh-line)&#x27;, &#x27;stroke-width&#x27;: 1, &#x27;data-chart-frame&#x27;: &#x27;&#x27; }));
    for (let i = 0; i &lt;= 4; i += 1) {
      const value = ceiling * i / 4;
      grid.appendChild(svgNode(&#x27;line&#x27;, { x1: margin.left, x2: width - margin.right, y1: y(value), y2: y(value), stroke: &#x27;var(--nh-line)&#x27;, &#x27;stroke-width&#x27;: 1 }));
      axes.appendChild(svgNode(&#x27;text&#x27;, { x: margin.left - 8, y: y(value) + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27; }, fmt(value, 0)));
    }
    axes.appendChild(svgNode(&#x27;text&#x27;, { x: 0, y: 14, class: &#x27;nh-axis-title axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;y&#x27; }, &#x27;車次／15 分&#x27;));
    axes.appendChild(svgNode(&#x27;text&#x27;, { x: width - margin.right, y: height - 1, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;nh-axis-title axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27; }, &#x27;時段&#x27;));
    const stride = narrow ? Math.ceil(n / 3) : Math.max(1, Math.ceil(n / 6));
    const ticks = [];
    for (let i = 0; i &lt; n; i += stride) ticks.push(i);
    ticks.push(n);
    ticks.forEach(function (index) {
      axes.appendChild(svgNode(&#x27;text&#x27;, { x: x(index), y: height - 20, &#x27;text-anchor&#x27;: index === 0 ? &#x27;start&#x27; : (index === n ? &#x27;end&#x27; : &#x27;middle&#x27;) }, timeAt(index * dt)));
    });
    const barLayer = get(&#x27;nh-demand-bars&#x27;);
    const activeKeys = new Set();
    [&#x27;base&#x27;, &#x27;after&#x27;].forEach(function (kind, k) {
      for (let i = 0; i &lt; n; i += 1) {
        const key = kind + i;
        activeKeys.add(key);
        let rect = barNodes.get(key);
        if (!rect) {
          rect = svgNode(&#x27;rect&#x27;, { class: &#x27;nh-bar &#x27; + (kind === &#x27;base&#x27; ? &#x27;nh-demand-before&#x27; : &#x27;nh-demand-after&#x27;), rx: 2 });
          barNodes.set(key, rect); barLayer.appendChild(rect);
        }
        const row = latest[kind].rows[i];
        const a = row ? row.a : 0;
        const bucketW = plotW / n;
        const barW = bucketW * .33;
        const px = x(i) + bucketW * (k === 0 ? .13 : .54);
        rect.style.x = px + &#x27;px&#x27;; rect.style.y = y(a) + &#x27;px&#x27;;
        rect.style.width = barW + &#x27;px&#x27;; rect.style.height = Math.max(0, plotH * a / ceiling) + &#x27;px&#x27;;
        rect.setAttribute(&#x27;data-tooltip&#x27;, timeAt(i * dt) + &#x27;–&#x27; + timeAt((i + 1) * dt) + &#x27; · &#x27; + (kind === &#x27;base&#x27; ? &#x27;原配置 &#x27; : &#x27;調整後 &#x27;) + fmt(a) + &#x27; 車次&#x27;);
        rect.setAttribute(&#x27;aria-label&#x27;, rect.getAttribute(&#x27;data-tooltip&#x27;));
      }
    });
    barNodes.forEach(function (node, key) { if (!activeKeys.has(key)) { node.remove(); barNodes.delete(key); } });
    axes.appendChild(svgNode(&#x27;line&#x27;, { x1: margin.left, x2: width - margin.right, y1: y(state.capacity), y2: y(state.capacity), stroke: &#x27;var(--nh-ink)&#x27;, &#x27;stroke-width&#x27;: 1.3, &#x27;stroke-dasharray&#x27;: &#x27;5 4&#x27; }));
    axes.appendChild(svgNode(&#x27;text&#x27;, { x: width - margin.right - 3, y: y(state.capacity) - 6, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;nh-axis-title&#x27; }, &#x27;容量 &#x27; + state.capacity));
    get(&#x27;nh-demand-desc&#x27;).textContent = &#x27;合成情境，非內湖實測預測。&#x27; + (state.mode === &#x27;all&#x27; ? &#x27;全體一起延後。&#x27; : &#x27;分批錯峰。&#x27;) + &#x27;每十五分鐘容量 &#x27; + state.capacity + &#x27; 車。原配置與調整後均為 &#x27; + totalVehicles + &#x27; 車次。&#x27;;
  }

  function drawHeat() {
    const n = latest.length;
    const means = latest.base.rows.concat(latest.after.rows).map(function (row) { return row.meanQueue; });
    const maximum = Math.max.apply(null, means.concat([0]));
    [&#x27;base&#x27;, &#x27;after&#x27;].forEach(function (kind) {
      const rowRoot = get(kind === &#x27;base&#x27; ? &#x27;nh-heat-before&#x27; : &#x27;nh-heat-after&#x27;);
      rowRoot.style.gridTemplateColumns = &#x27;repeat(&#x27; + n + &#x27;, minmax(0, 1fr))&#x27;;
      rowRoot.replaceChildren();
      const labels = [];
      for (let i = 0; i &lt; n; i += 1) {
        const data = latest[kind].rows[i];
        const average = data ? data.meanQueue : 0;
        const label = timeAt(i * dt) + &#x27;–&#x27; + timeAt((i + 1) * dt) + &#x27;：平均排隊 &#x27; + fmt(average, 1) + &#x27; 車&#x27;;
        labels.push(label);
        const cell = document.createElement(&#x27;div&#x27;);
        cell.className = &#x27;nh-heat-cell&#x27;;
        cell.style.background = heatColor(average, maximum);
        cell.setAttribute(&#x27;data-tooltip&#x27;, label);
        cell.setAttribute(&#x27;aria-label&#x27;, label);
        const number = document.createElement(&#x27;span&#x27;); number.className = &#x27;nh-heat-number&#x27;;
        number.textContent = average &gt; 0 ? fmt(average, 0) : &#x27;·&#x27;;
        cell.appendChild(number); rowRoot.appendChild(cell);
      }
      rowRoot.setAttribute(&#x27;aria-label&#x27;, (kind === &#x27;base&#x27; ? &#x27;原配置。&#x27; : &#x27;調整後。&#x27;) + labels.join(&#x27;；&#x27;));
    });
    const times = get(&#x27;nh-heat-times&#x27;); times.replaceChildren();
    const stride = Math.ceil(n / 3);
    const ticks = [];
    for (let i = 0; i &lt; n; i += stride) ticks.push(i);
    ticks.push(n);
    ticks.forEach(function (i) {
      const tick = document.createElement(&#x27;span&#x27;);
      tick.textContent = timeAt(i * dt); tick.style.left = (i / n * 100) + &#x27;%&#x27;;
      tick.style.transform = i === 0 ? &#x27;none&#x27; : (i === n ? &#x27;translateX(-100%)&#x27; : &#x27;translateX(-50%)&#x27;);
      times.appendChild(tick);
    });
    get(&#x27;nh-heat-max&#x27;).textContent = fmt(maximum, 0) + &#x27; 車&#x27;;
    const strip = get(&#x27;nh-scale-strip&#x27;); strip.replaceChildren();
    [0, .25, .5, .75, 1].forEach(function (ratio) {
      const item = document.createElement(&#x27;span&#x27;); item.style.background = heatColor(ratio, 1); strip.appendChild(item);
    });
  }

  function update() {
    const base = simulate(scenario(0, 0, &#x27;split&#x27;), state.capacity);
    const after = simulate(scenario(state.moved, state.shift, state.mode), state.capacity);
    latest = { base: base, after: after, length: Math.max(base.rows.length, after.rows.length) };
    get(&#x27;nh-total-headline&#x27;).textContent = fmt(totalVehicles);
    const moved = state.mode === &#x27;all&#x27; ? totalVehicles : state.moved;
    const reduction = base.delay &gt; 0 ? (base.delay - after.delay) / base.delay * 100 : 0;
    const mInput = get(&#x27;nh-moved&#x27;);
    mInput.disabled = state.mode === &#x27;all&#x27;;
    mInput.max = state.mode === &#x27;all&#x27; ? String(totalVehicles) : &#x27;450&#x27;;
    mInput.value = String(moved);
    get(&#x27;nh-moved-value&#x27;).textContent = fmt(moved) + &#x27; 車次・&#x27; + fmt(moved / totalVehicles * 100, 1) + &#x27;%&#x27;;
    get(&#x27;nh-moved-ceiling&#x27;).textContent = fmt(state.mode === &#x27;all&#x27; ? totalVehicles : 450) + &#x27; 車次&#x27;;
    get(&#x27;nh-capacity&#x27;).value = String(state.capacity);
    get(&#x27;nh-capacity-value&#x27;).textContent = state.capacity + &#x27; 車／15 分&#x27;;
    get(&#x27;nh-shift&#x27;).value = String(state.shift);
    get(&#x27;nh-shift-allocation&#x27;).textContent = state.mode === &#x27;all&#x27; ? &#x27;全體 &#x27; + fmt(totalVehicles) + &#x27; 車次抵達時間延後 &#x27; + state.shift * dt + &#x27; 分鐘。&#x27; : &#x27;07:30、07:45 兩批各移出 &#x27; + fmt(state.moved / 2) + &#x27; 車次，移至 &#x27; + timeAt((2 + state.shift) * dt) + &#x27;、&#x27; + timeAt((3 + state.shift) * dt) + &#x27;。&#x27;;
    root.querySelectorAll(&#x27;[data-nh-mode]&#x27;).forEach(function (button) { button.setAttribute(&#x27;aria-pressed&#x27;, String(button.getAttribute(&#x27;data-nh-mode&#x27;) === state.mode)); });
    get(&#x27;nh-delay-value&#x27;).textContent = fmt(after.delay / 60, 1);
    get(&#x27;nh-delay-base&#x27;).textContent = &#x27;原配置 &#x27; + fmt(base.delay / 60, 1);
    get(&#x27;nh-delay-delta&#x27;).textContent = Math.abs(reduction) &lt; 1e-7 ? &#x27;等待不變&#x27; : (reduction &gt; 0 ? &#x27;減少 &#x27; : &#x27;增加 &#x27;) + fmt(Math.abs(reduction), 1) + &#x27;%&#x27;;
    get(&#x27;nh-queue-value&#x27;).textContent = fmt(after.maximum);
    get(&#x27;nh-queue-base&#x27;).textContent = &#x27;原配置 &#x27; + fmt(base.maximum);
    get(&#x27;nh-queue-delta&#x27;).textContent = changeText(base.maximum, after.maximum, &#x27;車&#x27;);
    const clear = get(&#x27;nh-clear-value&#x27;);
    clear.textContent = timeAt(after.lastClear);
    clear.classList.toggle(&#x27;nh-no-queue&#x27;, after.lastClear === null);
    get(&#x27;nh-clear-base&#x27;).textContent = &#x27;原配置 &#x27; + timeAt(base.lastClear);
    const clearDiff = base.lastClear !== null &amp;&amp; after.lastClear !== null ? base.lastClear - after.lastClear : null;
    get(&#x27;nh-clear-delta&#x27;).textContent = clearDiff === null ? &#x27;未形成排隊&#x27; : (Math.abs(clearDiff) &lt; 1e-7 ? &#x27;不變&#x27; : (clearDiff &gt; 0 ? &#x27;提前 &#x27; : &#x27;延後 &#x27;) + fmt(Math.abs(clearDiff), 0) + &#x27; 分&#x27;);

    zeroSolutions = [];
    for (let movedCount = 0; movedCount &lt;= 450; movedCount += 10) {
      const result = simulate(scenario(movedCount, state.shift, &#x27;split&#x27;), state.capacity);
      if (result.maximum &lt; 1e-8) zeroSolutions.push(movedCount);
    }
    const threshold = get(&#x27;nh-threshold-value&#x27;);
    const thresholdContext = get(&#x27;nh-threshold-context&#x27;);
    const apply = get(&#x27;nh-apply-threshold&#x27;);
    if (zeroSolutions.length) {
      const first = zeroSolutions[0], last = zeroSolutions[zeroSolutions.length - 1];
      threshold.textContent = fmt(first) + &#x27; 車次 · &#x27; + fmt(first / totalVehicles * 100, 1) + &#x27;% 的總車流&#x27;;
      thresholdContext.textContent = first === last ? &#x27;目前只有此格點配置可清零；多移不一定更好。僅限模型範圍。&#x27; : &#x27;可清零車次範圍：&#x27; + fmt(first) + &#x27;–&#x27; + fmt(last) + &#x27;，每 10 車次檢查。僅限模型範圍。&#x27;;
      apply.disabled = false;
    } else {
      threshold.textContent = &#x27;此配置／上限內無法清零&#x27;;
      thresholdContext.textContent = &#x27;已檢查 0–450 車次，每 10 車次一格。可調整延後幅度或容量假設。&#x27;;
      apply.disabled = true;
    }
    let insight;
    if (state.mode === &#x27;all&#x27;) {
      insight = &#x27;全體晚到，只把同一段等待往後搬。&#x27;;
    } else if (after.maximum &lt; 1e-8) {
      insight = &#x27;需求落在容量內，這個配置讓排隊歸零。&#x27;;
    } else if (zeroSolutions.length &amp;&amp; state.moved &gt; zeroSolutions[zeroSolutions.length - 1]) {
      insight = &#x27;移得太多，較晚的時段又形成新排隊。&#x27;;
    } else if (Math.abs(reduction) &lt; 1e-7) {
      insight = &#x27;目前配置的累積等待，與原配置相同。&#x27;;
    } else if (reduction &gt; 0) {
      insight = &#x27;移動 &#x27; + fmt(moved / totalVehicles * 100, 1) + &#x27;% 車次，累積等待減少 &#x27; + fmt(reduction, 1) + &#x27;%。&#x27;;
    } else {
      insight = &#x27;這個配置使累積等待增加 &#x27; + fmt(-reduction, 1) + &#x27;%。&#x27;;
    }
    get(&#x27;nh-insight-main&#x27;).textContent = insight;
    get(&#x27;nh-insight-meta&#x27;).textContent = fmt(base.total) + &#x27; → &#x27; + fmt(after.total) + &#x27; 車次 · 總量不變&#x27;;
    get(&#x27;nh-accessible-results&#x27;).textContent = (state.mode === &#x27;all&#x27; ? &#x27;全體延後&#x27; : &#x27;分批錯峰&#x27;) + &#x27;，延後 &#x27; + state.shift * dt + &#x27; 分鐘，容量 &#x27; + state.capacity + &#x27; 車每十五分鐘。累積排隊由 &#x27; + fmt(base.delay / 60, 1) + &#x27; 調整為 &#x27; + fmt(after.delay / 60, 1) + &#x27; 車小時，最大排隊 &#x27; + after.maximum + &#x27; 車，最後清空 &#x27; + timeAt(after.lastClear) + &#x27;。&#x27; + threshold.textContent;
    drawDemand(); drawHeat();
  }

  get(&#x27;nh-moved&#x27;).addEventListener(&#x27;input&#x27;, function (event) { state.moved = Number(event.target.value); update(); });
  get(&#x27;nh-capacity&#x27;).addEventListener(&#x27;input&#x27;, function (event) { state.capacity = Number(event.target.value); update(); });
  get(&#x27;nh-shift&#x27;).addEventListener(&#x27;change&#x27;, function (event) { state.shift = Number(event.target.value); update(); });
  root.querySelectorAll(&#x27;[data-nh-mode]&#x27;).forEach(function (button) {
    button.addEventListener(&#x27;click&#x27;, function () { state.mode = button.getAttribute(&#x27;data-nh-mode&#x27;); update(); });
  });
  root.querySelectorAll(&#x27;[data-nh-preset]&#x27;).forEach(function (button) {
    button.addEventListener(&#x27;click&#x27;, function () {
      const choice = button.getAttribute(&#x27;data-nh-preset&#x27;);
      state.capacity = 300; state.shift = 3;
      state.mode = choice === &#x27;all&#x27; ? &#x27;all&#x27; : &#x27;split&#x27;;
      state.moved = choice === &#x27;quarter&#x27; ? 450 : 180;
      update();
    });
  });
  get(&#x27;nh-apply-threshold&#x27;).addEventListener(&#x27;click&#x27;, function () {
    if (!zeroSolutions.length) return;
    state.mode = &#x27;split&#x27;; state.moved = zeroSolutions[0]; update();
  });
  update();
  if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
    const observer = new ResizeObserver(function () {
      const nextWidth = Math.round(get(&#x27;nh-demand-wrap&#x27;).getBoundingClientRect().width);
      if (nextWidth !== lastWidth) drawDemand();
    });
    observer.observe(get(&#x27;nh-demand-wrap&#x27;));
  }
  root.neihuModel = { simulate: simulate, scenario: scenario, state: state, result: function () { return latest; }, refresh: update };
}());
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
